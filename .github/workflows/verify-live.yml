name: Verify live GitHub Pages deployment

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERIFY_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      E2E_BASE_URL: https://oryxdatasafe.com
      QA_EVIDENCE_DIR: review/live-production-qa
    steps:
      - name: Check out the deployed source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the deployed source
        run: npm run build

      - name: Wait for the actual domain and compare deployed bytes
        run: node scripts/verify-live.mjs

      - name: Prepare a Chromium browser
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser_path" ]; then
            npx playwright install --with-deps chromium
            browser_path="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')"
          fi
          test -x "$browser_path"
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Verify the actual domain in every browser project
        run: npm run test:e2e

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-qa-${{ github.event.workflow_run.head_sha }}
          path: |
            review/live-production-qa
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
